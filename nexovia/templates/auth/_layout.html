{% extends "base.html" %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body %}
<div class="auth-page">
  <section class="auth-panel">
    <div class="auth-panel-top">
      <a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">N</span>Nexovia</a>
    </div>
    <div class="auth-main">
      <div class="auth-card">{% block card %}{% endblock %}</div>
    </div>
  </section>
  <aside class="auth-aside">
    <p class="aside-quote">Study smarter. Understand deeper. Remember longer.</p>
    <p class="aside-sub">Your notes, flashcards and AI tutor in one calm workspace.</p>
  </aside>
</div>
{% endblock %}
