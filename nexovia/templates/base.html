{% from "partials/icons.html" import icon %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nexovia{% endblock %}</title>
  <meta name="description" content="Nexovia — the AI-powered learning platform for students.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f5f5f6'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='800' font-size='19' text-anchor='middle' fill='%230a0a0b'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  {% block styles %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" aria-live="polite">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="toast {{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
